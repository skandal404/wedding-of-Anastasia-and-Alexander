<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Александр и Анастасия | Свадебное приглашение</title>
    <!-- Open Graph -->
    <meta property="og:title" content="Александр & Анастасия | Свадебное приглашение">
    <meta property="og:description" content="Приглашаем вас разделить с нами этот день. 18 июля 2026, Капитан club">
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(rgba(255,252,248,.96), rgba(255,252,248,.96)),
                        url('img/decor/paper-texture-2.jpg');
            background-size: cover;
            background-attachment: fixed;
            color: #5f6f82;
            line-height: 1.5;
            overflow-x: hidden;
            position: relative;
        }

        /* Глобальное акварельное пятно */
        .global-watercolor {
            position: fixed;
            width: 1400px;
            left: 50%;
            top: 200px;
            transform: translateX(-50%);
            opacity: 0.32;
            z-index: 0;
            pointer-events: none;
        }

        /* Зернистость (лёгкая) */
        .grain-overlay {
            position: fixed;
            inset: 0;
            background-image: url('img/decor/grain-overlay.png');
            background-size: cover;
            opacity: 0.05;
            pointer-events: none;
            z-index: 999;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: #d8c19a;
            z-index: 1001;
            transition: width 0.1s;
        }

        /* Узкий контейнер */
        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 16px 80px;
            position: relative;
            z-index: 2;
        }

        
.invitation-card{
            position:relative;
            overflow:hidden;
            background:
                linear-gradient(rgba(255,252,248,.88), rgba(255,252,248,.88)),
                url('img/decor/paper-texture-2.jpg');
            background-size:cover;
            border:1px solid rgba(214,190,138,.25);
            box-shadow:0 30px 100px rgba(0,0,0,.08);
            padding:20px 0 60px;
        }

        .invitation-card::before{
            content:"";
            position:absolute;
            inset:0;
            background-image:
                url('img/decor/gold-speckles.png'),
                url('img/decor/watercolor-cloud-blue.png');
            background-repeat:repeat,no-repeat;
            background-size:900px auto, 1400px auto;
            background-position:center, center 200px;
            opacity:.28;
            pointer-events:none;
        }

        .invitation-card>*{
            position:relative;
            z-index:2;
        }

        /* Общие блоки — без блюра, плотный фон */
        .card {
            background: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82));
            border-radius: 24px;
            border: 1px solid rgba(214,190,138,.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            padding: 2rem 1.8rem;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Акварельное пятно под каждым блоком (вместо разделителей) */
        .card::before,
        .calendar-card::before,
        .story-timeline::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            background-image: url('img/decor/watercolor-cloud-blue.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
            bottom: -60px;
            right: -60px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: #7d8ea1;
            margin-bottom: 1.2rem;
            text-align: center;
            border-bottom: none;
            letter-spacing: 0.5px;
        }

        /* HERO — огромный, с большими листьями */
        .hero {
            position: relative;
            padding: 120px 40px 80px;
            text-align: center;
            background: transparent;
            border:none;
            box-shadow:none;
            overflow: visible;
        }

        .hero-leaf-left,
        .hero-leaf-right {
            right:-280px;
            top:-220px;
            transform:scaleX(-1);
        }
        .hero-leaf-left {
            left:-280px;
            top:-220px;
        }
        .hero-leaf-right {
            right:-280px;
            top:-220px;
            transform:scaleX(-1);
        }

        .hero-photo-frame {
            width: 420px;
            height: 560px;
            max-width: 100%;
            margin: 0 auto 50px;
            position: relative;
        }
        .hero-main-photo {
            position: absolute;
            inset: 18px;
            width: calc(100% - 36px);
            height: calc(100% - 36px);
            object-fit: cover;
            border-radius: 300px;
            z-index: 1;
        }
        .oval-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            opacity: 0.95;
        }

        .hero-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 7rem;
            font-weight: 400;
            color: #6d7f92;
            line-height: .85;
            letter-spacing: -2px;
            margin-top: 0;
        }
        .hero-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: #d8c19a;
            text-transform: uppercase;
            margin-top: 1rem;
        }
        .hero-subtitle {
            font-size: 0.95rem;
            font-weight: 300;
            color: #9aaabd;
            margin-top: 1rem;
        }

        /* КАЛЕНДАРЬ — огромный, во всю ширину */
        .calendar-section {
            display: flex;
            justify-content: center;
            margin: 0.5rem 0;
        }
        .calendar-card {
            width:100%;
            padding:120px 80px;
            border-radius:400px;
            background:rgba(255,255,255,.45);
            border:1px solid rgba(214,190,138,.3);
            text-align:center;
            position:relative;
            overflow:hidden;
            margin:50px 0;
            box-shadow:0 10px 40px rgba(0,0,0,.03);
        }
        .rsvp-form button {
            background: #d8c19a;
            color: #fff;
            border: none;
            padding: 0.9rem;
            border-radius: 60px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
            margin-top: 0.5rem;
        }
        .footer-ornament {
            width: 200px;
            display: block;
            margin: 1rem auto 1.5rem;
            opacity: 0.5;
        }

        /* Угловой декор — заметный */
        .site-corner {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .corner-1 {
            top: 0;
            left: 0;
            width: 280px;
        }
        .corner-2 {
            bottom: 0;
            right: 0;
            width: 280px;
            transform: rotate(180deg);
        }

        /* Анимация появления */
        .card, .hero, .calendar-card, .story-timeline {
            animation: fadeUp 0.9s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Мобильная версия — адаптация под большие элементы */
        @media (max-width: 680px) {
            .container { max-width: 540px; }
            .hero { padding: 80px 20px 60px; min-height: 720px; }
            .hero-photo-frame { width: 280px; height: 380px; }
            .hero-leaf-left,
        .hero-leaf-right {
            right:-280px;
            top:-220px;
            transform:scaleX(-1);
        }
    .startscreen-content {
        max-width: 90%;
        padding: 2rem;
        background: rgba(255,255,255,0.8);
        border-radius: 48px;
        border: 1px solid rgba(214,190,138,.2);
        text-align: center;
    }
    .startscreen-content img {
        width: 100px;
        border-radius: 50%;
        margin-bottom: 1rem;
        opacity: 0.9;
    }
    .startscreen-content h2 {
        font-family: 'Cormorant Garamond', serif;
        color: #74879b;
        font-size: 1.8rem;
        font-weight: 300;
    }
    .startscreen-content p {
        color: #9aaabd;
        font-size: 0.9rem;
    }
    .main-content { opacity: 0; transition: opacity 1.2s ease; }
    .main-content.visible { opacity: 1; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0.5rem 0; }
    .radio-group label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
    .rsvp-section h3 { font-size: 1rem; margin: 0.8rem 0 0.3rem; color: #7d8ea1; font-weight: 300; }
    input[type="radio"] { accent-color: #d8c19a; }
</style>

<script>
    const startScreen = document.getElementById('startscreen');
    const mainContent = document.getElementById('mainContent');
    const bgMusic = document.getElementById('bgMusic');
    let musicStarted = false;
    function startSite() {
        if (musicStarted) return;
        musicStarted = true;
        bgMusic.volume = 0.25;
        bgMusic.play().catch(e => console.log("autoplay blocked"));
        startScreen.classList.add('hidden');
        mainContent.classList.add('visible');
        document.body.style.overflow = 'auto';
    }
    startScreen.addEventListener('click', startSite);
    document.body.style.overflow = 'hidden';

    window.addEventListener('scroll', () => {
        const winScroll = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - window.innerHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById('progressBar').style.width = scrolled + '%';
    });

    const path = document.querySelector("#timeline-path");
    if (path) {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
        window.addEventListener("scroll", () => {
            const scroll = window.scrollY;
            const height = document.body.scrollHeight - window.innerHeight;
            const progress = Math.min(1, Math.max(0, scroll / height));
            path.style.strokeDashoffset = length - (length * progress);
        });
    }

    const events = document.querySelectorAll('.timeline-event');
    function revealTimeline() {
        events.forEach(e => {
            const top = e.getBoundingClientRect().top;
            if (top < window.innerHeight * 0.85) e.classList.add('visible');
        });
    }
    window.addEventListener('scroll', revealTimeline);
    revealTimeline();

    const form = document.getElementById('rsvpForm');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('guestName').value.trim();
        const attending = document.querySelector('input[name="attending"]:checked');
        if (!name || !attending) return alert('Укажите имя и ответ');
        alert(`Спасибо, ${name}! Ваш ответ принят.`);
        form.reset();
        document.querySelector('input[name="attending"][value="yes"]').checked = true;
    });
</script>
</body>
</html>
